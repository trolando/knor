# Builds and tests the SYNTCOMP image (Dockerfile) on every push and pull
# request; on a version tag or a manual run, also publishes it as
# ghcr.io/<owner>/knor-syntcomp.
name: SYNTCOMP image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: knor-syntcomp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test every configuration on the examples
        run: >
          docker run --rm
          -v "$PWD/examples:/in:ro"
          -v "$PWD/test/expected_verdicts.txt:/expected:ro"
          knor-syntcomp:test /usr/local/bin/syntcomp-test /in /expected

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/knor-syntcomp
          for tag in "${GITHUB_REF_NAME//\//-}" "sha-${GITHUB_SHA::7}"; do
              docker tag knor-syntcomp:test "$image:$tag"
              docker push "$image:$tag"
          done
