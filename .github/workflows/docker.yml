name: Build and publish Knor Docker image

on:
  push:
    branches: [master, encoding]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Compile and check controllers on both architectures with the image's
  # toolchain before publishing sources. Building a source image alone does
  # not exercise the ARM64 compiler.
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-slim
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake make libboost-random-dev ca-certificates git

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile knor
        run: ./scripts/compile.sh

      - name: Check acceptance conditions
        run: bash test/acceptance.sh build/knor

      - name: Build controller checker
        run: cmake --build build --target aigcheck --parallel 2

      - name: Check synthesis from files and stdin
        run: |
          for spec in examples/full_arbiter_2.tlsf.ehoa test/acceptance/genbuchi_alternate.hoa; do
            rc=0
            ./scripts/knor.sh --auto-encode --compress -a "$spec" > /tmp/controller.aag || rc=$?
            test "$rc" -eq 10
            ./build/aigcheck "$spec" /tmp/controller.aag
          done
          rc=0
          ./scripts/knor.sh --auto-encode --compress -a < test/acceptance/genbuchi_alternate.hoa > /tmp/controller.aag || rc=$?
          test "$rc" -eq 10
          ./build/aigcheck test/acceptance/genbuchi_alternate.hoa /tmp/controller.aag
          rc=0
          ./scripts/knor.sh --auto-encode --compress -a < test/acceptance/genbuchi_env.hoa > /tmp/unrealizable.out || rc=$?
          test "$rc" -eq 20
          rc=0
          ./scripts/knor.sh --no-paritize --real test/acceptance/genbuchi_alternate.hoa > /tmp/verdict 2> /tmp/knor.err || rc=$?
          test "$rc" -eq 104
          rc=0
          ./scripts/knor-synt.sh --real test/acceptance/genbuchi_alternate.hoa > /tmp/verdict || rc=$?
          test "$rc" -eq 10
          grep -qx REALIZABLE /tmp/verdict
          rc=0
          ./scripts/knor-synt.sh --no-paritize --real test/acceptance/genbuchi_alternate.hoa > /tmp/verdict 2> /tmp/knor.err || rc=$?
          test "$rc" -eq 104

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Compilation happens later on the target machine.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
